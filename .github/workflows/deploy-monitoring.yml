name: Deploy monitoring stack

# Redeploys the EC2-hosted monitoring stack (api + prometheus + grafana) via
# AWS Systems Manager Run Command -- no SSH involved, same OIDC role already
# used for the API's Beanstalk deploy, extended with a scoped SSM policy.
# Only fires on pushes that actually touch the monitoring stack, not every
# push to main -- see docs/technical-decisions.md.

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "monitoring/**"
      - "app/**"
      - "Dockerfile"
      - "models/*.dvc"

permissions:
  contents: read

jobs:
  ssm-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: i-0e29d7ad3c19a05c7
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      # AWS-RunShellScript runs as root, not ssm-user (unlike an interactive
      # Session Manager shell) -- so this needs its own `safe.directory`
      # exemption (git refuses to operate in a repo it doesn't own) and
      # can't rely on the ssm-user's PATH having uv on it already.
      - name: Redeploy monitoring stack via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "set -e",
              "git config --global --add safe.directory /home/ssm-user/tech-challenge-03-v1",
              "cd /home/ssm-user/tech-challenge-03-v1",
              "git pull",
              "command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh",
              "export PATH=\"/root/.local/bin:$PATH\"",
              "uvx --from '\''dvc[s3]'\'' dvc pull models/pipeline_fp32.onnx models/vocabulary.json",
              "docker compose up -d --build"
            ]}' \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"
          echo "Waiting for command to finish..."

          STATUS="Pending"
          for _ in $(seq 1 30); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command finished with status $STATUS"
            exit 1
          fi
