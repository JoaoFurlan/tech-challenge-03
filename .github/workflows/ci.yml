name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest -q

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    # Only on pushes to main, not PRs -- OIDC credentials shouldn't be
    # handed to untrusted PR code.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: medsys-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # TEMPORARY diagnostic step -- prints the real OIDC token's
      # non-secret claims (sub/aud/repository/ref) so we can compare them
      # against the trust policy's expected pattern directly, instead of
      # guessing further. Remove once the AssumeRoleWithWebIdentity
      # failure is resolved.
      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+')
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, repository_owner, ref, actor}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # v4 attaches session tags (repo/actor/workflow/...) by default,
          # which needs the trust policy to also grant sts:TagSession --
          # ours only grants AssumeRoleWithWebIdentity, so the whole call
          # was rejected. We don't use the tags for anything, so skip them
          # rather than widen the trust policy further.
          role-skip-session-tagging: true

      # models/pipeline_fp32.onnx is DVC-tracked (S3), not committed to
      # git -- needs the role's inline policy to also grant S3 read on
      # the DVC bucket, alongside its ECR push permissions. Run in an
      # isolated env via uvx -- no need to sync the project's own deps
      # (dvc lives in the "training" group) just to pull one file.
      - name: Pull model artifact from DVC
        run: uvx --from 'dvc[s3]' dvc pull models/pipeline_fp32.onnx

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
