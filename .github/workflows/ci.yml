name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing major/minor tags as of v8.0.0 (a
      # deliberate supply-chain-attack hardening) -- must pin the exact
      # version, @v10 alone won't resolve.
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --group dev
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing major/minor tags as of v8.0.0 (a
      # deliberate supply-chain-attack hardening) -- must pin the exact
      # version, @v10 alone won't resolve.
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --group dev
      - run: uv run pytest -q

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    # Only on pushes to main, not PRs -- OIDC credentials shouldn't be
    # handed to untrusted PR code.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "033266804343"
      ECR_REPOSITORY: medsys-api
      EB_APP_NAME: medsys-triage
      EB_ENV_NAME: Medsys-triage-env
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing major/minor tags as of v8.0.0 (a
      # deliberate supply-chain-attack hardening) -- must pin the exact
      # version, @v10 alone won't resolve.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # v4 attaches session tags (repo/actor/workflow/...) by default,
          # which needs the trust policy to also grant sts:TagSession --
          # ours only grants AssumeRoleWithWebIdentity, so the whole call
          # was rejected. We don't use the tags for anything, so skip them
          # rather than widen the trust policy further.
          role-skip-session-tagging: true

      # models/pipeline_fp32.onnx is DVC-tracked (S3), not committed to
      # git -- needs the role's inline policy to also grant S3 read on
      # the DVC bucket, alongside its ECR push permissions.
      #
      # Uses the project's own locked "training" group (not an isolated
      # `uvx --from 'dvc[s3]'` env) -- an unpinned ephemeral env resolves
      # fresh dependency versions on every run, which broke here with a
      # real dvc/pygtrie incompatibility ("type object 'Trie' has no
      # attribute '_NONE_STEP'") that our locally-tested uv.lock avoids.
      - name: Pull model artifact from DVC
        run: |
          uv sync --locked --group training --no-dev
          uv run dvc pull models/pipeline_fp32.onnx

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # Dockerrun.aws.json pins a specific image tag (we never push
      # `latest`), so redeploying means rewriting that tag and pushing a
      # new Beanstalk application version -- Beanstalk doesn't watch ECR
      # for new images on its own.
      - name: Update Dockerrun.aws.json with the new image tag
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          jq --arg image "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            '.Image.Name = $image' Dockerrun.aws.json > Dockerrun.aws.json.new
          mv Dockerrun.aws.json.new Dockerrun.aws.json

      - name: Deploy to Elastic Beanstalk
        env:
          VERSION_LABEL: sha-${{ github.sha }}
        run: |
          EB_BUCKET="elasticbeanstalk-${AWS_REGION}-${AWS_ACCOUNT_ID}"
          aws s3 cp Dockerrun.aws.json "s3://$EB_BUCKET/$VERSION_LABEL/Dockerrun.aws.json"

          # Idempotent: a version label collision only happens if a prior
          # run's create-application-version succeeded but a later step
          # (e.g. update-environment) then failed and got retried -- not a
          # real error in that case, just re-deploy the existing version.
          set +e
          CREATE_OUTPUT=$(aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=$EB_BUCKET,S3Key=$VERSION_LABEL/Dockerrun.aws.json" 2>&1)
          CREATE_STATUS=$?
          set -e
          if [ $CREATE_STATUS -ne 0 ]; then
            if echo "$CREATE_OUTPUT" | grep -q "already exists"; then
              echo "Application version $VERSION_LABEL already exists -- deploying it as-is."
            else
              echo "$CREATE_OUTPUT"
              echo "::error::create-application-version failed"
              exit 1
            fi
          fi

          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV_NAME" \
            --version-label "$VERSION_LABEL"

          echo "Waiting for the environment update to finish..."
          for _ in $(seq 1 30); do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENV_NAME" --query 'Environments[0].Status' --output text)
            echo "Status: $STATUS"
            [ "$STATUS" = "Ready" ] && break
            sleep 20
          done

          HEALTH=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENV_NAME" --query 'Environments[0].Health' --output text)
          echo "Final health: $HEALTH"
          if [ "$HEALTH" != "Green" ]; then
            echo "::error::Beanstalk environment health is '$HEALTH' (expected Green) after deployment"
            exit 1
          fi
